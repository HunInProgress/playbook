## Komodo Resource Sync — Coordinator Stacks
## Register in: Komodo UI > Resource Syncs > New Sync
##   repo: HunInProgress/playbook  path: syncs/coordinator.toml
##
## pangolin:          public tunnel server — deploy once on an internet-facing host.
## headscale:         WireGuard coordination server — on `internal`, behind traefik-internal.
## komodo-periphery:  Komodo agent — deploy on every managed server.
##
## Note: Komodo Core itself is NOT managed here; it is bootstrapped manually
##       via scripts/deploy-komodo.sh before Komodo can manage anything.

# ---------------------------------------------------------------------------
# Public tunnel server
# ---------------------------------------------------------------------------

[[stack]]
name = "pangolin"
[stack.config]
server = ""
repo = "HunInProgress/playbook"
branch = "master"
file_paths = ["coordinators/pangolin/docker-compose.yml"]
environment = """
PANGOLIN_VERSION = [[PANGOLIN_VERSION]]
GERBIL_VERSION = [[GERBIL_VERSION]]
TRAEFIK_VERSION = [[TRAEFIK_VERSION]]
"""

# ---------------------------------------------------------------------------
# WireGuard coordination (internal)
# ---------------------------------------------------------------------------

[[stack]]
name = "headscale"
[stack.config]
server = ""
repo = "HunInProgress/playbook"
branch = "master"
after = ["proxy-internal"]
file_paths = ["coordinators/headscale/docker-compose.yml"]
environment = """
HEADSCALE_VERSION = [[HEADSCALE_VERSION]]
HEADSCALE_ADMIN_VERSION = [[HEADSCALE_ADMIN_VERSION]]
URL =
"""

# ---------------------------------------------------------------------------
# Komodo Periphery agent
# ---------------------------------------------------------------------------

[[stack]]
name = "komodo-periphery"
[stack.config]
server = ""
repo = "HunInProgress/playbook"
branch = "master"
run_directory = "coordinators/komodo/periphery"
file_paths = ["docker-compose.yaml"]
environment = """
KOMODO_IMAGE_TAG = [[KOMODO_IMAGE_TAG]]
TZ = [[TZ]]
PERIPHERY_CORE_ADDRESS =        # ws://<core-hostname-or-ip>:9120
PERIPHERY_CONNECT_AS =          # name shown in Komodo UI
PERIPHERY_ONBOARDING_KEY =      # generate in Komodo UI > Settings > Onboarding; remove after first connect
PERIPHERY_CORE_PUBLIC_KEYS = file:/config/keys/core.pub
PERIPHERY_ROOT_DIRECTORY = /etc/komodo
PERIPHERY_INCLUDE_DISK_MOUNTS = /etc/hostname
"""
