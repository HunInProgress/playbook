## Komodo Resource Sync — Global Variables
## Register in: Komodo UI > Resource Syncs > New Sync
##   repo: HunInProgress/playbook  path: syncs/variables.toml
##
## Stack definitions: syncs/stacks/<name>.toml (Komodo-managed only)
## Server definitions: syncs/servers.toml
## Per-server network template: syncs/stacks/network.toml; apps use after=["network"].
##
## Not in Resource Sync (bootstrap before Komodo can deploy stacks):
##   Komodo Core (+ local Periphery): scripts/deploy-komodo.sh
##   Periphery on other hosts: scripts/deploy-periphery.sh
##   Pangolin: coordinators/pangolin/docker-compose.yml
##   Headscale: coordinators/headscale/docker-compose.yml

# ---------------------------------------------------------------------------
# General
# ---------------------------------------------------------------------------

[[variable]]
name = "TZ"
value = "Asia/Ho_Chi_Minh"
description = "Timezone for all services"

[[variable]]
name = "PUID"
value = "100000"
description = "Process UID for app containers"

[[variable]]
name = "PGID"
value = "100000"
description = "Process GID for app containers"

[[variable]]
name = "PANGOLIN_ENDPOINT"
value = "https://pangolin.hmmmm.dev"
description = "Pangolin server endpoint shared by newt and olm (e.g. https://pangolin.example.com)"

[[variable]]
name = "LAB_PERIPHERY_ADDRESS"
value = ""
description = "Komodo Server Lab — Core reaches Periphery (e.g. https://lab.example:8120). Empty if Periphery uses outbound-only."

[[variable]]
name = "ORACLE_PERIPHERY_ADDRESS"
value = ""
description = "Komodo Server Oracle — Core reaches Periphery (e.g. https://oracle.example:8120)"

