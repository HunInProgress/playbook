## Komodo Resource Sync — Global Variables
## Register in: Komodo UI > Resource Syncs > New Sync
##   repo: HunInProgress/playbook  path: syncs/variables.toml
##
## Image version variables are interpolated into stack environments via [[VARIABLE_NAME]].
## Compose files reference them as ${VARIABLE_NAME:-default}.

# ---------------------------------------------------------------------------
# General
# ---------------------------------------------------------------------------

[[variable]]
name = "TZ"
value = "Asia/Ho_Chi_Minh"
description = "Timezone for all services"

[[variable]]
name = "PUID"
value = "100000"
description = "Linux user ID for linuxserver.io containers (matches LXC subuid offset)"

[[variable]]
name = "PGID"
value = "100000"
description = "Linux group ID for linuxserver.io containers (matches LXC subgid offset)"

[[variable]]
name = "PANGOLIN_ENDPOINT"
value = ""
description = "Pangolin server endpoint shared by newt and olm (e.g. https://pangolin.example.com)"

# ---------------------------------------------------------------------------
# Network / proxy images
# ---------------------------------------------------------------------------

[[variable]]
name = "TRAEFIK_VERSION"
value = "v3.7.4"
description = "Traefik reverse proxy (internal and private zones)"

[[variable]]
