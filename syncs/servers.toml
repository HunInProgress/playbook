## Komodo Resource Sync — Servers (Periphery targets)
## Register: repo HunInProgress/playbook  path: syncs/servers.toml
##
## Names must match stack.config.server in syncs/stacks/*.toml (Lab, Oracle, …).
## Set LAB_PERIPHERY_ADDRESS / ORACLE_PERIPHERY_ADDRESS in variables.toml or Komodo UI.
## Passkeys and onboarding: configure in UI after first Periphery connect — do not commit secrets.

[[server]]
name = "Lab"
description = "Homelab Docker host (network template + apps)"
tags = ["homelab"]
[server.config]
address = "[[LAB_PERIPHERY_ADDRESS]]"
region = "lab"
enabled = true
stats_monitoring = true

[[server]]
name = "Oracle"
description = "Cloud / Oracle host"
tags = ["cloud"]
[server.config]
address = "[[ORACLE_PERIPHERY_ADDRESS]]"
region = "oracle"
enabled = true
stats_monitoring = true
