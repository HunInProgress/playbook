## Komodo Resource Sync — Servers (Periphery targets)
## Outbound Periphery: agents dial Core (PERIPHERY_CORE_ADDRESS). Leave address empty —
## Core does not need a public URL to Lab/Oracle; commands use the open WebSocket.
##
## Bootstrap order:
##   1. Execute sync (creates Lab / Oracle Server rows with empty address), OR create in UI
##   2. deploy-periphery.sh on each host with PERIPHERY_CONNECT_AS = Lab | Oracle
##   3. Onboarding key links the agent; stacks can attach to server name
##
## Names must match stack.config.server and PERIPHERY_CONNECT_AS exactly.

[[server]]
name = "Lab"
description = "Homelab Docker host (apps)"
tags = ["homelab"]
[server.config]
address = ""
region = "lab"
enabled = true
stats_monitoring = true

[[server]]
name = "Oracle"
description = "Cloud / Oracle host"
tags = ["cloud"]
[server.config]
address = ""
region = "oracle"
enabled = true
stats_monitoring = true
