## Komodo Resource Sync — Network / Proxy Stacks
## Register in: Komodo UI > Resource Syncs > New Sync
##   repo: HunInProgress/playbook  path: syncs/network.toml
##
## Three isolated zones — no shared bridge between them:
##   proxy-internal: traefik on `internal` — LAN / homelab apps
##   proxy-public:   newt on `public` — public apps (Pangolin routes directly)
##   proxy-private:  traefik + tailscale on `private` — tailnet apps
##   olm:            bare-metal / LXC Pangolin connector (non-Docker)

# ---------------------------------------------------------------------------
# Internal reverse proxy (traefik)
# ---------------------------------------------------------------------------

[[stack]]
name = "proxy-internal"
[stack.config]
server = ""
template = true
repo = "HunInProgress/playbook"
branch = "master"
file_paths = ["networks/proxy-internal/docker-compose.yaml"]
environment = """
HTTP_PORT = 80
TRAEFIK_VERSION = [[TRAEFIK_VERSION]]
"""

# ---------------------------------------------------------------------------
# Public tunnel (newt) — no internal network dependency
# ---------------------------------------------------------------------------

[[stack]]
name = "proxy-public"
[stack.config]
server = ""
template = true
repo = "HunInProgress/playbook"
branch = "master"
file_paths = ["networks/proxy-public/docker-compose.yaml"]
environment = """
PANGOLIN_ENDPOINT = [[PANGOLIN_ENDPOINT]]
NEWT_VERSION = [[NEWT_VERSION]]
NEWT_ID =
NEWT_SECRET =
"""

# ---------------------------------------------------------------------------
# Private tunnel (tailscale + traefik) — self-contained on `private`
# ---------------------------------------------------------------------------

[[stack]]
name = "proxy-private"
[stack.config]
server = ""
template = true
repo = "HunInProgress/playbook"
branch = "master"
file_paths = ["networks/proxy-private/docker-compose.yaml"]
environment = """
HTTP_PORT = 80
TRAEFIK_VERSION = [[TRAEFIK_VERSION]]
TAILSCALE_VERSION = [[TAILSCALE_VERSION]]
HOST_NAME =
TS_AUTHKEY =
TAILSCALE_STATE = /var/tailscale/state
"""

# ---------------------------------------------------------------------------
# OLM — bare-metal / LXC newt tunnel client
# ---------------------------------------------------------------------------

[[stack]]
name = "olm"
[stack.config]
server = ""
template = true
repo = "HunInProgress/playbook"
branch = "master"
file_paths = ["apps/olm/docker-compose.yml"]
environment = """
PANGOLIN_ENDPOINT = [[PANGOLIN_ENDPOINT]]
OLM_VERSION = [[OLM_VERSION]]
OLM_ID =
OLM_SECRET =
"""
