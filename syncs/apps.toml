## Komodo Resource Sync — Application Stacks
## Register in: Komodo UI > Resource Syncs > New Sync
##   repo: HunInProgress/playbook  path: syncs/apps.toml
##
## Internal stacks depend on proxy-internal (join `internal` as external network).
## Public stack (dev) depends on proxy-public (join `public` as external network).
## Mark stacks as Template in Komodo UI to duplicate per server.

# ---------------------------------------------------------------------------
# Media (internal)
# ---------------------------------------------------------------------------

[[stack]]
name = "media"
[stack.config]
server = ""
repo = "HunInProgress/playbook"
branch = "master"
after = ["proxy-internal"]
file_paths = [
  "apps/jellyfin/docker-compose.yml",
  "apps/arr/docker-compose.yaml"
]
environment = """
TZ = [[TZ]]
PUID = [[PUID]]
PGID = [[PGID]]
JELLYFIN_VERSION = [[JELLYFIN_VERSION]]
PROWLARR_VERSION = [[PROWLARR_VERSION]]
SONARR_VERSION = [[SONARR_VERSION]]
RADARR_VERSION = [[RADARR_VERSION]]
LIDARR_VERSION = [[LIDARR_VERSION]]
BAZARR_VERSION = [[BAZARR_VERSION]]
QBITTORRENT_VERSION = [[QBITTORRENT_VERSION]]
JELLYFIN_HOST =
JELLYFIN_CONFIG = /mnt/rust/jellyfin/config
JELLYFIN_CACHE = /mnt/rust/jellyfin/cache
MEDIA_PATH = /mnt/media
ARR_HOST =
PROWLARR_CONFIG = /mnt/rust/prowlarr
SONARR_CONFIG = /mnt/rust/sonarr
RADARR_CONFIG = /mnt/rust/radarr
LIDARR_CONFIG = /mnt/rust/lidarr
BAZARR_CONFIG = /mnt/rust/bazarr
QBITTORRENT_CONFIG = /mnt/rust/qbittorrent
TV_PATH = /mnt/media/tv
MOVIES_PATH = /mnt/media/movies
MUSIC_PATH = /mnt/media/music
DOWNLOADS_PATH = /mnt/media/downloads
"""

# ---------------------------------------------------------------------------
# Photos (internal)
# ---------------------------------------------------------------------------

[[stack]]
name = "immich"
[stack.config]
server = ""
repo = "HunInProgress/playbook"
branch = "master"
after = ["proxy-internal"]
file_paths = ["apps/immich/docker-compose.yaml"]
environment = """
