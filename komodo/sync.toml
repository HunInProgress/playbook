# ---------------------------------------------------------------------------
# Komodo infrastructure (bootstrap — managed separately)
# ---------------------------------------------------------------------------

[[stack]]
name = "komodo"
[stack.config]
server = ""
repo = "HunInProgress/playbook"
branch = "master"
run_directory = "komodo/core"
file_paths = ["docker-compose.yaml"]
environment = """
KOMODO_IMAGE_TAG = 2
KOMODO_MONGO_DATA = /etc/komodo/mongo/data
KOMODO_MONGO_CONFIG = /etc/komodo/mongo/config
KOMODO_KEYS_PATH = /etc/komodo/keys
KOMODO_BACKUPS_PATH = /etc/komodo/backups
KOMODO_DATABASE_USERNAME = admin
KOMODO_DATABASE_PASSWORD =
TZ = [[TZ]]
KOMODO_HOST =
KOMODO_TITLE = Komodo
KOMODO_PERIPHERY_PUBLIC_KEY = file:/config/keys/periphery.pub
KOMODO_LOCAL_AUTH = true
KOMODO_INIT_ADMIN_USERNAME = admin
KOMODO_INIT_ADMIN_PASSWORD =
KOMODO_FIRST_SERVER_NAME = Local
KOMODO_WEBHOOK_SECRET =
KOMODO_JWT_SECRET =
KOMODO_JWT_TTL = 1-day
KOMODO_MONITORING_INTERVAL = 15-sec
PERIPHERY_CORE_ADDRESS = ws://core:9120
PERIPHERY_CONNECT_AS = Local
PERIPHERY_CORE_PUBLIC_KEYS = file:/config/keys/core.pub
PERIPHERY_ROOT_DIRECTORY = /etc/komodo
PERIPHERY_INCLUDE_DISK_MOUNTS = /etc/hostname
"""

[[stack]]
name = "komodo-periphery"
[stack.config]
server = ""
repo = "HunInProgress/playbook"
branch = "master"
run_directory = "komodo/periphery"
file_paths = ["docker-compose.yaml"]
environment = """
KOMODO_IMAGE_TAG = 2
TZ = [[TZ]]
PERIPHERY_CORE_ADDRESS =
PERIPHERY_CONNECT_AS =
PERIPHERY_CORE_PUBLIC_KEYS =
PERIPHERY_ROOT_DIRECTORY = /etc/komodo
PERIPHERY_INCLUDE_DISK_MOUNTS = /etc/hostname
"""

# ---------------------------------------------------------------------------
# Global variables
# Shared values interpolated into stack environments via [[VARIABLE_NAME]].
# Set actual values in: Komodo UI > Variables
# ---------------------------------------------------------------------------

[[variable]]
name = "TZ"
value = "Asia/Ho_Chi_Minh"
description = "Timezone for all services"

[[variable]]
name = "PUID"
value = "1000"
description = "Linux user ID for linuxserver.io containers"

[[variable]]
name = "PGID"
value = "1000"
description = "Linux group ID for linuxserver.io containers"
