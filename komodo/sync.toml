## Komodo Resource Sync
## Docs: https://komo.do/docs/sync-resources
##
## This file declares all stacks in the repo. Import it via:
##   Komodo UI > Resource Syncs > New Sync > point at this repo, path = komodo/sync.toml
##
## After import, each stack appears in the UI with its environment pre-filled.
## Set the `server` field for each stack to the target server, then deploy.
##
## Global variables (shared across stacks) are defined at the bottom of this file.
## Reference them in stack environments using [[VARIABLE_NAME]] syntax.

# ---------------------------------------------------------------------------
# Networking / Tunneling
# ---------------------------------------------------------------------------

[[stack]]
name = "traefik"
[stack.config]
server = ""
repo = "HunInProgress/playbook"
branch = "master"
run_directory = "composes/traefik"
file_paths = ["docker-compose.yml"]
environment = """
HTTP_PORT = 80
"""

