## Komodo Resource Sync — Global Variables
## Register in: Komodo UI > Resource Syncs > New Sync
##   repo: HunInProgress/playbook  path: komodo/syncs/variables.toml
##
## These variables are interpolated into stack environments using [[VARIABLE_NAME]].
## Set actual values in Komodo UI > Variables after import.

[[variable]]
name = "TZ"
value = "Asia/Ho_Chi_Minh"
description = "Timezone for all services"

[[variable]]
name = "PUID"
value = "1000"
description = "Linux user ID for linuxserver.io containers"

[[variable]]
name = "PGID"
value = "1000"
description = "Linux group ID for linuxserver.io containers"

[[variable]]
name = "PANGOLIN_ENDPOINT"
value = ""
description = "Pangolin server endpoint shared by newt and olm (e.g. https://pangolin.example.com)"
