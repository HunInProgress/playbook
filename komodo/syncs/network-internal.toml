## Komodo Resource Sync — Internal Networking
## Register in: Komodo UI > Resource Syncs > New Sync
##   repo: HunInProgress/playbook  path: komodo/syncs/network-internal.toml
##
## Stacks: traefik, tailscale, headscale

[[stack]]
name = "traefik"
[stack.config]
server = ""
repo = "HunInProgress/playbook"
branch = "master"
run_directory = "composes/traefik"
file_paths = ["docker-compose.yml"]
environment = """
HTTP_PORT = 80
"""

[[stack]]
name = "tailscale"
[stack.config]
server = ""
repo = "HunInProgress/playbook"
branch = "master"
run_directory = "composes/tailscale"
file_paths = ["docker-compose.yml"]
environment = """
HOST_NAME =
TS_AUTHKEY =
"""

[[stack]]
name = "headscale"
[stack.config]
server = ""
repo = "HunInProgress/playbook"
branch = "master"
run_directory = "composes/headscale"
file_paths = ["docker-compose.yml"]
environment = """
URL =
"""
