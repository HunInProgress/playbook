## Komodo Resource Sync — Dev Infrastructure
## Register in: Komodo UI > Resource Syncs > New Sync
##   repo: HunInProgress/playbook  path: komodo/syncs/dev.toml
##
## Stacks: forgejo, forgejo-runner, dind

[[stack]]
name = "forgejo"
[stack.config]
server = ""
repo = "HunInProgress/playbook"
branch = "master"
run_directory = "composes/forgejo"
file_paths = ["docker-compose.yml"]

[[stack]]
name = "forgejo-runner"
[stack.config]
server = ""
repo = "HunInProgress/playbook"
branch = "master"
run_directory = "composes/forgejo-runner"
file_paths = ["docker-compose.yaml"]

[[stack]]
name = "dind"
[stack.config]
server = ""
repo = "HunInProgress/playbook"
branch = "master"
run_directory = "composes/dind"
file_paths = ["docker-compose.yaml"]
