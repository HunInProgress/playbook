## Komodo Resource Sync — Komodo Infrastructure
## Register in: Komodo UI > Resource Syncs > New Sync
##   repo: HunInProgress/playbook  path: komodo/syncs/infra.toml
##
## Note: these stacks bootstrap Komodo itself and its Periphery agents.
## The Core stack is typically deployed once via scripts/deploy-komodo.sh,
## but is listed here for visibility and re-deployment from the UI.
## Periphery stacks are deployed on remote servers via scripts/deploy-periphery.sh.

[[stack]]
name = "komodo"
[stack.config]
server = ""
repo = "HunInProgress/playbook"
branch = "master"
run_directory = "komodo/core"
file_paths = ["docker-compose.yaml"]
environment = """
KOMODO_IMAGE_TAG = 2
KOMODO_MONGO_DATA = /etc/komodo/mongo/data
KOMODO_MONGO_CONFIG = /etc/komodo/mongo/config
KOMODO_KEYS_PATH = /etc/komodo/keys
KOMODO_BACKUPS_PATH = /etc/komodo/backups
KOMODO_DATABASE_USERNAME = admin
KOMODO_DATABASE_PASSWORD =
TZ = [[TZ]]
KOMODO_HOST =
KOMODO_TITLE = Komodo
KOMODO_PERIPHERY_PUBLIC_KEY = file:/config/keys/periphery.pub
KOMODO_LOCAL_AUTH = true
KOMODO_INIT_ADMIN_USERNAME = admin
KOMODO_INIT_ADMIN_PASSWORD =
KOMODO_FIRST_SERVER_NAME = Local
KOMODO_WEBHOOK_SECRET =
KOMODO_JWT_SECRET =
KOMODO_JWT_TTL = 1-day
KOMODO_MONITORING_INTERVAL = 15-sec
"""

[[stack]]
name = "komodo-periphery"
[stack.config]
server = ""
repo = "HunInProgress/playbook"
branch = "master"
run_directory = "komodo/periphery"
file_paths = ["docker-compose.yaml"]
environment = """
KOMODO_IMAGE_TAG = 2
TZ = [[TZ]]
PERIPHERY_CORE_ADDRESS =        # ws://<core-hostname-or-ip>:9120
PERIPHERY_CONNECT_AS =          # name shown in Komodo UI
PERIPHERY_ONBOARDING_KEY =      # generate in Komodo UI > Settings > Onboarding; remove after first connect
PERIPHERY_CORE_PUBLIC_KEYS = file:/config/keys/core.pub
PERIPHERY_ROOT_DIRECTORY = /etc/komodo
PERIPHERY_INCLUDE_DISK_MOUNTS = /etc/hostname
"""
