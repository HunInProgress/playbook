# Manual bootstrap on remote hosts — use scripts/deploy-periphery.sh (not Resource Sync).
# Core node bundles periphery in coordinators/komodo/core/docker-compose.yaml.

name: komodo-periphery

services:
  periphery:
    image: ghcr.io/moghtech/komodo-periphery:${KOMODO_IMAGE_TAG:-2}
    container_name: periphery
    init: true
    restart: unless-stopped
    env_file: .env
    volumes:
      - ${PERIPHERY_KEYS_PATH:-/etc/komodo/keys}:/config/keys
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc
      - ${PERIPHERY_ROOT_DIRECTORY:-/etc/komodo}:${PERIPHERY_ROOT_DIRECTORY:-/etc/komodo}
