name: pangolin

networks:
  default:
    driver: bridge
    enable_ipv6: true
    name: pangolin

services:
  gerbil:
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    command:
      - --reachableAt=http://gerbil:3004
      - --generateAndSaveKeyTo=/var/config/key
      - --remoteConfig=http://pangolin:3001/api/v1/
    container_name: gerbil
    depends_on:
      pangolin:
        condition: service_healthy
    image: docker.io/fosrl/gerbil:${GERBIL_VERSION:-1.3.0}
    ports:
      - 51820:51820/udp
      - 21820:21820/udp
      - 443:443
      - 80:80
      - 222:222

    restart: unless-stopped
    volumes:
      - /mnt/default/volumes/pangolin/config:/var/config
  pangolin:
    container_name: pangolin
    healthcheck:
      interval: 10s
      retries: 15
      test:
        - CMD
        - curl
        - -f
        - http://localhost:3001/api/v1/
      timeout: 10s
    image: docker.io/fosrl/pangolin:${PANGOLIN_VERSION:-ee-1.18.4}
    restart: unless-stopped
    volumes:
      - /mnt/default/volumes/pangolin/config:/app/config
  traefik:
    command:
      - --configFile=/etc/traefik/traefik_config.yml
    container_name: traefik
    depends_on:
      # crowdsec:
      #   condition: service_healthy
      pangolin:
        condition: service_healthy
    image: docker.io/traefik:${TRAEFIK_VERSION:-v3.7.4}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    network_mode: service:gerbil
    restart: unless-stopped
    volumes:
      - /mnt/default/volumes/pangolin/config/traefik:/etc/traefik:ro
      - /mnt/default/volumes/pangolin/config/letsencrypt:/letsencrypt
      - /mnt/default/volumes/pangolin/config/traefik/logs:/var/log/traefik
      - /var/run/docker.sock:/var/run/docker.sock:ro
