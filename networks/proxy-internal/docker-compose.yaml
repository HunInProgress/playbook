# Internal proxy: traefik only (LAN / homelab).
# Internal apps join `internal` and use Host() routing via traefik labels.

networks:
  internal:
    name: internal
    driver: bridge

services:
  traefik:
    image: traefik:${TRAEFIK_VERSION:-v3.7.4}
    container_name: traefik
    restart: unless-stopped
    networks:
      - internal
    ports:
      - "${HTTP_PORT:-80}:80"
    command:
      - "--entrypoints.web.address=:${HTTP_PORT:-80}"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=internal"
      - "--log.level=INFO"
      - "--accesslog=true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
