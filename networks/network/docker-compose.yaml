# Per-host network stack: three isolated bridges, one Traefik, newt (public), tailscale (private).
# Instantiate from Komodo template on every server; app stacks use after=["network"].
#
# Traefik is on internal, public, and private. Do not set providers.docker.network globally;
# each app label must set traefik.docker.network to the zone it uses.

networks:
  internal:
    name: internal
    driver: bridge
  public:
    name: public
    driver: bridge
  private:
    name: private
    driver: bridge

services:
  traefik:
    image: traefik:${TRAEFIK_VERSION:-v3.7.4}
    container_name: traefik
    restart: unless-stopped
    networks:
      - internal
      - public
      - private
    ports:
      - "${HTTP_PORT:-80}:80"
      - "8088:8080"
    command:
      - "--entrypoints.web.address=:80"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--api.insecure=true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  newt:
    image: fosrl/newt:${NEWT_VERSION:-1.3.2}
    container_name: newt
    restart: unless-stopped
    networks:
      - public
    environment:
      - PANGOLIN_ENDPOINT=${PANGOLIN_ENDPOINT}
      - NEWT_ID=${NEWT_ID}
      - NEWT_SECRET=${NEWT_SECRET}

  tailscale:
    image: tailscale/tailscale:${TAILSCALE_VERSION:-v1.96.5}
    container_name: tailscale
    hostname: ${HOST_NAME}
    restart: unless-stopped
    depends_on:
      - traefik
    networks:
      - private
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_DEST_IP=traefik
    volumes:
      - ${TAILSCALE_STATE:-/var/tailscale/state}:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
