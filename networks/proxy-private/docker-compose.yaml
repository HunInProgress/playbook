# Private tunnel: tailscale + traefik on the `private` network.
# Tailscale forwards tailnet traffic to traefik-private; apps join `private`
# with traefik labels. Isolated from `internal` and `public`.

networks:
  private:
    name: private
    driver: bridge

services:
  traefik:
    image: traefik:${TRAEFIK_VERSION:-v3.7.4}
    container_name: traefik-private
    restart: unless-stopped
    networks:
      - private
    ports:
      - "${HTTP_PORT:-80}:80"
    command:
      - "--entrypoints.web.address=:80"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=private"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  tailscale:
    image: tailscale/tailscale:${TAILSCALE_VERSION:-v1.96.5}
    container_name: tailscale
    hostname: ${HOST_NAME}
    restart: unless-stopped
    networks:
      - private
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_DEST_IP=traefik-private
    volumes:
      - ${TAILSCALE_STATE:-/var/tailscale/state}:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
