networks:
  public:
    name: public
    external: true

services:
  vaultwarden:
    image: vaultwarden/server:${VAULTWARDEN_VERSION:-1.21.0}
    container_name: vaultwarden
    restart: unless-stopped
    volumes:
      - ${VAULTWARDEN_DATA:-/mnt/rust/vaultwarden/data}:/data
    environment:
      - DOMAIN=${VAULTWARDEN_DOMAIN}
      - WEBSOCKET_ENABLED=true
    networks:
      - public
