networks:
  internal:
    name: internal
    external: true

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:${OPEN_WEBUI_VERSION:-v0.9.6}
    container_name: open-webui
    user: "${PUID:-100000}:${PGID:-100000}"
    networks:
      - internal
      - ollama
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - /mnt/rust/open-webui:/app/backend/data
    depends_on:
      - ollama
    restart: unless-stopped
    labels:
      traefik.enable: "true"
      traefik.http.routers.open-webui.rule: Host(`${OPEN_WEBUI_HOST}`)
      traefik.http.routers.open-webui.entrypoints: web
      traefik.http.services.open-webui.loadbalancer.server.port: 8080
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
