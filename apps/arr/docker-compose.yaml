networks:
  internal:
    name: internal
    external: true

services:
  # Indexer proxy for all arr apps
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:${PROWLARR_VERSION:-2.4.0}
    container_name: prowlarr
    environment:
      - PUID=${PUID:-100000}
      - PGID=${PGID:-100000}
      - TZ=${TZ}
    volumes:
      - ${PROWLARR_CONFIG:-/mnt/rust/prowlarr}:/config
    restart: unless-stopped
    networks:
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prowlarr.rule=Host(`prowl.${ARR_HOST}`)"
      - "traefik.http.routers.prowlarr.entrypoints=web"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # TV show management
  sonarr:
    image: lscr.io/linuxserver/sonarr:${SONARR_VERSION:-4.0.17}
    container_name: sonarr
    environment:
      - PUID=${PUID:-100000}
      - PGID=${PGID:-100000}
      - TZ=${TZ}
    volumes:
      - ${SONARR_CONFIG:-/mnt/rust/sonarr}:/config
      - ${TV_PATH:-/mnt/rust/media/tv}:/tv
      - ${DOWNLOADS_PATH:-/mnt/rust/media/downloads}:/downloads
    depends_on:
      - prowlarr
    restart: unless-stopped
    networks:
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr.rule=Host(`son.${ARR_HOST}`)"
      - "traefik.http.routers.sonarr.entrypoints=web"
      - "traefik.http.services.sonarr.loadbalancer.server.port=8989"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # Movie management
  radarr:
    image: lscr.io/linuxserver/radarr:${RADARR_VERSION:-6.2.1}
    container_name: radarr
    environment:
      - PUID=${PUID:-100000}
      - PGID=${PGID:-100000}
      - TZ=${TZ}
    volumes:
      - ${RADARR_CONFIG:-/mnt/rust/radarr}:/config
      - ${MOVIES_PATH:-/mnt/rust/media/movies}:/movies
      - ${DOWNLOADS_PATH:-/mnt/rust/media/downloads}:/downloads
    depends_on:
      - prowlarr
    restart: unless-stopped
    networks:
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.rule=Host(`rad.${ARR_HOST}`)"
      - "traefik.http.routers.radarr.entrypoints=web"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # Music management
  lidarr:
    image: lscr.io/linuxserver/lidarr:${LIDARR_VERSION:-3.1.0}
    container_name: lidarr
    environment:
      - PUID=${PUID:-100000}
      - PGID=${PGID:-100000}
      - TZ=${TZ}
    volumes:
      - ${LIDARR_CONFIG:-/mnt/rust/lidarr}:/config
      - ${MUSIC_PATH:-/mnt/rust/media/music}:/music
      - ${DOWNLOADS_PATH:-/mnt/rust/media/downloads}:/downloads
    depends_on:
      - prowlarr
    restart: unless-stopped
    networks:
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lidarr.rule=Host(`lid.${ARR_HOST}`)"
      - "traefik.http.routers.lidarr.entrypoints=web"
      - "traefik.http.services.lidarr.loadbalancer.server.port=8686"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # Subtitle management
  bazarr:
    image: lscr.io/linuxserver/bazarr:${BAZARR_VERSION:-1.5.6}
    container_name: bazarr
    environment:
      - PUID=${PUID:-100000}
      - PGID=${PGID:-100000}
      - TZ=${TZ}
    volumes:
      - ${BAZARR_CONFIG:-/mnt/rust/bazarr}:/config
      - ${TV_PATH:-/mnt/rust/media/tv}:/tv
      - ${MOVIES_PATH:-/mnt/rust/media/movies}:/movies
    depends_on:
      - sonarr
      - radarr
    restart: unless-stopped
    networks:
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bazarr.rule=Host(`baz.${ARR_HOST}`)"
      - "traefik.http.routers.bazarr.entrypoints=web"
      - "traefik.http.services.bazarr.loadbalancer.server.port=6767"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Torrent client (qBittorrent)
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:${QBITTORRENT_VERSION:-5.2.1}
    container_name: qbittorrent
    environment:
      - PUID=${PUID:-100000}
      - PGID=${PGID:-100000}
      - TZ=${TZ}
      - WEBUI_PORT=8080
    volumes:
      - ${QBITTORRENT_CONFIG:-/mnt/rust/qbittorrent}:/config
      - ${DOWNLOADS_PATH:-/mnt/rust/media/downloads}:/downloads
    ports:
      - "6881:6881"
      - "6881:6881/udp"
      - "6882:6882"
    restart: unless-stopped
    networks:
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qbittorrent.rule=Host(`tor.${ARR_HOST}`)"
      - "traefik.http.routers.qbittorrent.entrypoints=web"
      - "traefik.http.services.qbittorrent.loadbalancer.server.port=8080"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
