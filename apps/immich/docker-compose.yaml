#
# WARNING: To install Immich, follow our guide: https://docs.immich.app/install/docker-compose
#
# Make sure to use the docker-compose.yml of the current release:
#
# https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
#
# The compose file on main may not be compatible with the latest release.

name: immich

networks:
  internal:
    name: internal
    external: true
  immich:
    name: immich
    driver: bridge

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v2.7.5}
    volumes:
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      DB_HOSTNAME: database
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE_NAME: ${DB_DATABASE_NAME}
      REDIS_HOSTNAME: redis
    depends_on:
      - redis
      - database
    restart: unless-stopped
    networks:
      - internal
      - immich
    labels:
      traefik.enable: "true"
      traefik.http.routers.immich.rule: Host(`${IMMICH_HOST}`)
      traefik.http.routers.immich.entrypoints: web
      traefik.http.services.immich.loadbalancer.server.port: 2283
    healthcheck:
      disable: false
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities:
                - gpu
                - video

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-v2.7.5}-cuda
    volumes:
      - ${MODELS_CACHE_LOCATION}:/cache
    restart: always
    networks:
      - immich
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities:
                - gpu
                - compute

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:${IMMICH_VALKEY_VERSION:-9}
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always
    networks:
      - immich
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:${IMMICH_POSTGRES_VERSION:-14-vectorchord0.4.3-pgvectors0.2.0}
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      # DB_STORAGE_TYPE: 'HDD'
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    networks:
      - immich
    healthcheck:
      disable: false
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
