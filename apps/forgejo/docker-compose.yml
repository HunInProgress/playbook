networks:
  public:
    name: public
    external: true

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:${FORGEJO_VERSION:-15.0.2}
    container_name: forgejo
    environment:
      - USER_UID=${PUID:-1000}
      - USER_GID=${PGID:-1000}
      - FORGEJO__server__ROOT_URL=${FORGEJO_URL}
    restart: unless-stopped
    networks:
      - public
    volumes:
      - ${FORGEJO_DATA:-/mnt/rust/forgejo}:/data
      - /etc/localtime:/etc/localtime:ro
