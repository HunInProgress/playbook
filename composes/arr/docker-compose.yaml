services:
  # Indexer proxy for all arr apps
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /mnt/rust/prowlarr:/config
    ports:
      - "6969:6969"
    restart: unless-stopped

  # TV show management
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /mnt/rust/sonarr:/config
      - /mnt/media/tv:/tv # Adjust path to your TV shows
      - /mnt/rust/downloads:/downloads # Adjust path to your downloads
    ports:
      - "8989:8989"
    depends_on:
      - prowlarr
    restart: unless-stopped

  # Movie management
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /mnt/rust/radarr:/config
      - /mnt/media/movies:/movies # Adjust path to your movies
      - /mnt/rust/downloads:/downloads # Adjust path to your downloads
    ports:
      - "7878:7878"
    depends_on:
      - prowlarr
    restart: unless-stopped

  # Music management
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /mnt/rust/lidarr:/config
      - /mnt/media/music:/music # Adjust path to your music
      - /mnt/rust/downloads:/downloads # Adjust path to your downloads
    ports:
      - "8686:8686"
    depends_on:
      - prowlarr
    restart: unless-stopped

  # Subtitle management
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /mnt/rust/bazarr:/config
      - /mnt/media/tv:/tv # Adjust path to your TV shows
      - /mnt/media/movies:/movies # Adjust path to your movies
    ports:
      - "6767:6767"
    depends_on:
      - sonarr
      - radarr
    restart: unless-stopped

  # Torrent client (qBittorrent)
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - WEBUI_PORT=6881
    volumes:
      - /mnt/rust/qbittorrent:/config
      - /mnt/rust/downloads:/downloads # Adjust path to your downloads
    ports:
      - "6881:6881"
      - "6881:6881/udp"
      - "6882:6882"
    restart: unless-stopped
